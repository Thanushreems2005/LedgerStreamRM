name: LedgerStream RM CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-tests:
    name: Python Regression Tests & Syntax Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledgerstream
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      kafka:
        image: confluentinc/cp-kafka:7.6.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          CLUSTER_ID: "lZWk5Yw0Tiq9ONZadOe9oA=="
        ports:
          - 9092:9092
        options: >-
          --health-cmd "kafka-topics --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js 18 (for Express API)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ledgerstream/ledgerstream/consumer/requirements.txt

      - name: Install API dependencies
        run: npm ci
        working-directory: ledgerstream/ledgerstream/api

      - name: Wait for Kafka readiness
        run: |
          for i in {1..30}; do
            if docker exec $(docker ps -q --filter ancestor=confluentinc/cp-kafka:7.6.0) kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
              echo "Kafka is fully ready and responding to kafka-topics!"
              exit 0
            fi
            echo "Waiting for Kafka..."
            sleep 1
          done
          echo "Kafka failed to ready within 30 seconds"
          exit 1

      - name: Initialize PostgreSQL database schema
        run: |
          PGPASSWORD=ledger psql -h localhost -p 5433 -U ledger -d ledgerstream -f ledgerstream/ledgerstream/init-db/schema.sql

      - name: Start Express API server
        run: |
          nohup node server.js > api.log 2>&1 &
        working-directory: ledgerstream/ledgerstream/api
        env:
          PGPORT: 5433
          API_PORT: 3001

      - name: Wait for Express API readiness
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3001/api/health | grep -q '"status":"ok"'; then
              echo "Express API is ready!"
              cat ledgerstream/ledgerstream/api/api.log || true
              exit 0
            fi
            echo "Waiting for Express API..."
            sleep 1
          done
          echo "Express API failed to ready within 30 seconds"
          echo "--- API LOG ---"
          cat ledgerstream/ledgerstream/api/api.log || true
          exit 1

      - name: Validate Python syntax
        run: |
          python -m py_compile ledgerstream/ledgerstream/consumer/ledger_consumer.py
          python -m py_compile ledgerstream/ledgerstream/fraud/fraud_consumer.py
          python -m py_compile ledgerstream/ledgerstream/fraud/features.py

      - name: Run regression test suite (33 tests)
        run: |
          python -m unittest tests/regression_tests.py
        working-directory: ledgerstream/ledgerstream

  frontend-build:
    name: Frontend Install & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ledgerstream/ledgerstream/frontend

      - name: Build frontend production bundle
        run: npm run build
        working-directory: ledgerstream/ledgerstream/frontend

  docker-build:
    name: Docker Container Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t ledgerstream-rm:ci -f ledgerstream/ledgerstream/Dockerfile ledgerstream/ledgerstream

