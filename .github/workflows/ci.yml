name: LedgerStream RM CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-tests:
    name: Python Regression Tests & Syntax Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledgerstream
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js 18 (for Express API)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ledgerstream/ledgerstream/consumer/requirements.txt

      - name: Install API dependencies
        run: npm ci
        working-directory: ledgerstream/ledgerstream/api

      - name: Initialize PostgreSQL database schema
        run: |
          PGPASSWORD=ledger psql -h localhost -p 5433 -U ledger -d ledgerstream -f ledgerstream/ledgerstream/init-db/schema.sql

      - name: Start Express API server
        run: |
          node server.js &
        working-directory: ledgerstream/ledgerstream/api
        env:
          PGPORT: 5433
          API_PORT: 3001

      - name: Wait for Express API readiness
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3001/api/health | grep -q '"status":"ok"'; then
              echo "Express API is ready!"
              exit 0
            fi
            echo "Waiting for Express API..."
            sleep 1
          done
          echo "Express API failed to ready within 30 seconds"
          exit 1

      - name: Validate Python syntax
        run: |
          python -m py_compile ledgerstream/ledgerstream/consumer/ledger_consumer.py
          python -m py_compile ledgerstream/ledgerstream/fraud/fraud_consumer.py
          python -m py_compile ledgerstream/ledgerstream/fraud/features.py

      - name: Run regression test suite (33 tests)
        run: |
          python -m unittest tests/regression_tests.py
        working-directory: ledgerstream/ledgerstream

  frontend-build:
    name: Frontend Install & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ledgerstream/ledgerstream/frontend

      - name: Build frontend production bundle
        run: npm run build
        working-directory: ledgerstream/ledgerstream/frontend

  docker-build:
    name: Docker Container Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t ledgerstream-rm:ci -f ledgerstream/ledgerstream/Dockerfile ledgerstream/ledgerstream
